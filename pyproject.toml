[project]
name = "miniwow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<=3.12"
dependencies = [
    "peewee>=3.17.0",
    "pytest>=9.0.2",
    "imagehash>=4.3.2",
    "pytest-timeout>=2.4.0",
    "setuptools>=80.9.0",
    "coloredlogs>=15.0.1",
    "airtest>=1.4.3",
    "transitions>=0.9.0",
    "streamlit>=1.52.2",
    "pandas>=2.2.0",
    "streamlit-autorefresh>=1.0.1",
    "requests>=2.32.5",
    "opencv-python-headless>=4.11.0.86",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
    "typer>=0.21.0",
    "vibe-ocr>=0.1.5",
    "vibe-colored-logger>=0.1.0",
    "pushover-complete>=1.5.0",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "prometheus-client>=0.24.1",
    "httpx>=0.28.1",
    "textual>=8.0.0",
]

[dependency-groups]
dev = ["pyright>=1.1.407", "pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[tool.uv.sources]
# vibe-ocr 必须用本地源码，不能用 PyPI 上的同名轮子。
#
# 为什么（2026-11-17 体检）：本地库 `E:\Projects\pythonlib\vibe-ocr` 修过三处能力
# —— 缓存 TTL 过期（272846f）、find(exact=)（3421221）、OCR 请求瞬态 502 重试（ca2b365），
# 而 PyPI 上同名 0.1.6 轮子**一个都没有**（版本号没跟着 bump，属于同名不同物）。
# 之前靠手工 `uv pip install -e` 维持 editable，只要有人跑一次 `uv sync`（计划任务的
# `uv run` 会自动同步）就会静默退回轮子，于是重试与 TTL 一起消失：
# 一次 502 就退化成「这次没读到」，过期缓存永远不复用（10-24、09 月的旧病根）。
# 写进 sources 之后，`uv sync` 反而会把本地版装回来，且库再修会自动生效。
vibe-ocr = { path = "../pythonlib/vibe-ocr", editable = true }

[tool.ruff]
line-length = 100

[tool.uv]
# 声明你需要支持的平台集合：macOS arm64 + Windows x64（可选再加 Windows arm64）
required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
    # 如果你也要支持 Windows on ARM，可打开这一行
    # "sys_platform == 'win32' and platform_machine == 'ARM64'",
]


# 关键：把 pywin32 覆盖成“仅 Windows 安装”
# 这样就算有上游把 pywin32 误写成跨平台依赖，也会被你这里纠正回去
override-dependencies = ["pywin32==311; sys_platform == 'win32'"]

[tool.poe.tasks]
web = "uv run streamlit run dashboard_runtime_status.py"
stats = "uv run check_progress.py"
reset-daily = "uv run python -m scripts.reset_daily_progress"
cron = "uv run cron_run_all_dungeons.py"
cron-1 = "uv run ./run_dungeons.py --emulator 192.168.1.150:5555 --session warrior --config warrior"
test = "pytest tests/"
lint = "ruff check . &&  pyright"
tui = "uv run auto_dungeon_tui.py"
api = "uv run uvicorn api_server:app --host 0.0.0.0 --port 8000"
panic-stop = "uv run python -m scripts.kill_all_emulators"
doctor = "uv run python scripts/bluestack-tool.py doctor"
# 每周挑战「聚魂之地」：自动接任务 → 反复挑战直到打不过，1 小时硬超时（原 m14.air 的接任者）
m14 = "uv run weekly_soul_land.py"
